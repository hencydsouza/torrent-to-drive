services:
  torrent-to-drive:
    image: ghcr.io/hencydsouza/torrent-to-drive:latest
    build: .  # `docker compose up --build` builds locally instead of pulling
    container_name: torrent-to-drive
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config  # OAuth client, Google token, settings.yaml
      - ./data:/app/data      # downloads (deleted after upload) + torrents.db
    environment:
      # Optional. Pick the folder on the Settings page instead; this is only used when none was saved there.
      - DRIVE_FOLDER_ID=${DRIVE_FOLDER_ID:-}
    restart: unless-stopped
